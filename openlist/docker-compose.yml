networks:
  openlist:
    enable_ipv6: true

services:
  openlist:
    image: openlistteam/openlist:latest
    container_name: openlist
    restart: unless-stopped
    user: 0:0
    ports:
      - 5244:5244
    volumes:
      - ./data:/opt/openlist/data
    networks:
      - openlist
    env_file:
      - .env
