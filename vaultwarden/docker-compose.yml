services:
  vaultwarden:
    image: vaultwarden/server:alpine
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - ./data:/data
    env_file:
      - .env

  caddy:
    image: caddy:alpine
    container_name: caddy-vaultwarden
    restart: unless-stopped
    depends_on:
      - vaultwarden
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 80:80
      - 443:443
